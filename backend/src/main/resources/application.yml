spring:
  application:
    name: mcq-api
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/mcq?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:mcq}
    password: ${DB_PASSWORD:mcq_dev_pass}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only proves the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
